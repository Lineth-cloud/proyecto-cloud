AWSTemplateFormatVersion: '2010-09-09'
Description: Instancia EC2, bucket S3 y regla de firewall basica

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Key pair para conectarse por SSH
  Amild:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id

Resources:
  FirewallBasico:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permite SSH y HTTP
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 22
        ToPort: 22
        CidrIp: 0.0.0.0/0
      - IpProtocol: tcp
        FromPort: 80
        ToPort: 80
        CidrIp: 0.0.0.0/0

  Servidor:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: !Ref Amild
      KeyName: !Ref KeyName
      SecurityGroupIds:
        - !GetAtt FirewallBasico.GroupId
      UserData:
        Fn::Base64: |
          #!/bin/bash
          apt update -y
          apt install -y nginx
          systemctl enable --now nginx

BucketArchivos:
  Type: AWS::S3::Bucket
  Properties:
    PublicAccessBlockConfiguration:
      BlockPublicAcls: true
      BlockPublicPolicy: true
      IgnorePublicAcls: true
      RestrictPublicBuckets: true
    BucketEncryption:
      ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256

Outputs:
  IpPublica:
    Value: !GetAtt Servidor.PublicIp
  NombreBucket:
    Value: !Ref BucketArchivos
      
